[project]
name = "linaw-stt"
version = "0.1.0"
description = "Linaw speech pipeline: Soniox online + local Whisper offline STT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
    "whisperlivekit>=0.2.26",
]

[tool.fastapi]
entrypoint = "app.main:app"
